{% extends 'base.html' %}{% block content %}<h1>Configurações e auditoria</h1><section class="card"><h2>Contrato e alertas</h2><form class="row" method="post" action="/settings"><input type="hidden" name="token" value="{{csrf}}"><label>Parcela fixa mensal (R$)<input name="fixed_fee" value="{{config.fixed_fee}}" required></label><label>Alerta acima de (páginas por coleta)<input type="number" min="1" name="jump_limit" value="{{config.jump_limit}}" required></label><button>Salvar</button></form></section><section class="card"><h2>Últimas alterações</h2><div class="scroll"><table><tr><th>Data</th><th>Usuário</th><th>Ação</th><th>Detalhes</th></tr>{% for a in audits %}<tr><td>{{a.at}}</td><td>{{a.actor}}</td><td>{{a.action}}</td><td>{{a.details}}</td></tr>{% endfor %}</table></div></section>{% endblock %}
