<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tiragem | Medsel</title><style>
:root{font-family:system-ui,sans-serif;color:#152a3b;background:#f2f6f8}body{margin:0}header{background:#123849;color:white;padding:18px max(24px,calc((100vw - 1200px)/2));display:flex;gap:26px;align-items:center;flex-wrap:wrap}header strong{font-size:1.3rem}a{color:#086b87}header a{color:#d9f4fb;text-decoration:none}header form{margin-left:auto}main{max-width:1200px;margin:32px auto;padding:0 20px}.card{background:white;border:1px solid #dce7ea;border-radius:12px;padding:20px;margin-bottom:18px;box-shadow:0 2px 8px #12384909}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.metric{font-size:2rem;font-weight:750}.muted{color:#58717d;font-size:.88rem}.row{display:flex;align-items:end;gap:12px;flex-wrap:wrap}label{display:grid;gap:5px;font-size:.87rem;font-weight:650}input,select,button{font:inherit;padding:9px;border:1px solid #b9cbd1;border-radius:7px;max-width:230px}button{background:#087795;border-color:#087795;color:white;cursor:pointer}button:hover{background:#075d76}table{border-collapse:collapse;width:100%;font-size:.88rem}td,th{text-align:left;padding:10px;border-bottom:1px solid #e4edef}th{background:#ecf4f6} .scroll{overflow:auto}.bad{color:#ad3434;font-weight:bold}.good{color:#18734b;font-weight:bold}h1{font-size:1.65rem}h2{font-size:1.18rem}small{color:#617984}code{white-space:nowrap}.bar{height:12px;background:#d6eaf0;border-radius:6px;overflow:hidden}.bar span{display:block;height:100%;background:#087795}.bar-row{display:grid;grid-template-columns:minmax(120px,220px) 1fr 70px;gap:12px;align-items:center;margin:10px 0}.chart{display:flex;align-items:end;gap:3px;height:130px;overflow-x:auto}.chart div{min-width:7px;background:#087795;border-radius:3px 3px 0 0}
</style></head><body><header><strong>Tiragem</strong>{% if user %}<a href="/">Dashboard</a><a href="/invoices">Demonstrativos</a>{% if user.role=='admin' %}<a href="/printers">Impressoras</a><a href="/settings">Configurações e auditoria</a>{% endif %}<form method="post" action="/logout"><input type="hidden" name="token" value="{{ csrf }}"><button>Sair ({{user.name}})</button></form>{% endif %}</header><main>{% block content %}{% endblock %}</main></body></html>
