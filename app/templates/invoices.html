{% extends 'base.html' %}{% block content %}<h1>Demonstrativos</h1>{% if user.role=='admin' %}<section class="card"><h2>Conferir um PDF da Maquim</h2><form class="row" method="post" action="/invoices" enctype="multipart/form-data"><input type="hidden" name="token" value="{{csrf}}"><label>PDF (até 5 MB)<input type="file" name="file" accept="application/pdf" required></label><button>Importar</button></form></section>{% endif %}<section class="card"><h2>Histórico</h2><div class="scroll"><table><tr><th>Competência</th><th>Arquivo</th><th>Enviado em</th></tr>{% for i in invoices %}<tr><td>{{i.month}}</td><td><a href="/invoices/{{i.id}}">{{i.filename}}</a></td><td>{{i.uploaded_at}}</td></tr>{% endfor %}</table></div></section>{% endblock %}
